# -----------------------------------------------------------------------------
# 🌊 Lunar Eclipse Mako Global Style Settings
# -----------------------------------------------------------------------------
font=Sans 11
background-color=#0d0813ee
text-color=#f4f0fa
width=360
height=150
margin=15,25,25,15
padding=16
border-size=2
border-color=#5a3d7c
border-radius=16
progress-color=over #d4b8e8

# Layout & Behavior
format=<b><span foreground='#d4b8e8'>%s</span></b>\n%b
text-alignment=left
default-timeout=6000
layer=top
anchor=top-right

# Urgency Overrides
[urgency=low]
border-color=#1c1329
text-color=#9e8cae
default-timeout=4000

[urgency=critical]
border-color=#d4b8e8
text-color=#ffffff
default-timeout=0
